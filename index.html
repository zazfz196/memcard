<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#170d24" />
    <title>Jogo da memória</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <p class="game__eyebrow">Jogo da memória</p>
        <h1>Encontre os pares</h1>
        <p class="game__hint">Vire duas cartas e encontre as formas iguais.</p>
      </header>
      <section class="score" aria-label="Placar">
        <div class="score__item">
          <span class="score__label">Jogadas</span>
          <strong class="score__value" id="moves">0</strong>
        </div>
        <div class="score__item">
          <span class="score__label">Pares</span>
          <strong class="score__value"><span id="pairs">0</span><span class="score__total"> / 8</span></strong>
        </div>
        <div class="score__item">
          <span class="score__label">Tempo</span>
          <strong class="score__value" id="timer">00:00</strong>
        </div>
      </section>
      <div class="board" id="board" role="group" aria-label="Tabuleiro com 16 cartas"></div>
      <div class="game__footer">
        <p id="status" aria-live="polite">Escolha uma carta para começar.</p>
        <button class="restart" id="restart" type="button">Novo jogo</button>
      </div>
    </main>
  </body>
</html>
